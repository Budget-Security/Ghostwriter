; The middleware is a standalone Flask app, not part of the Django project.
;
; Without an inifile here, pytest walks up to the repo root pytest.ini, adopts
; the repo root as rootdir, and inherits its `--ds=config.settings.test`, which
; requires pytest-django and Django settings this app does not have. An inifile
; in this directory anchors rootdir here and stops that inheritance.
[pytest]
testpaths = .
